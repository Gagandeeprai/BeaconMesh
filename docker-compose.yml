version: "3.8"

services:
  simulation:
    build:
      context: ./simulation
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - beaconmesh-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SOLVER_URL=http://simulation:8000/api/v1/optimize/rescue
    depends_on:
      - simulation
    networks:
      - beaconmesh-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend
    networks:
      - beaconmesh-network

networks:
  beaconmesh-network:
    driver: bridge
