version: '3.8'

services:
  simulation:
    build:
      context: ./simulation
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - beaconmesh-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - beaconmesh-net
    depends_on:
      simulation:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - beaconmesh-net
    depends_on:
      - backend
    environment:
      - NODE_ENV=production

networks:
  beaconmesh-net:
    driver: bridge
